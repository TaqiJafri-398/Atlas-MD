<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <title>Atlas Portfolio</title>
    <link rel="shortcut icon" href="TA.png" type="image/x-icon" />
    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body>
    <main class="portfolio-page">
      <section class="hero-card">
        <div class="profile-block">
          <img class="avatar" src="TA.png" alt="Atlas profile picture" />
          <div>
            <p class="kicker">Creative Developer</p>
            <h1>Atlas</h1>
            <p class="tagline">
              I design immersive web experiences, brand identities, and polished
              digital products with a futuristic visual style.
            </p>
          </div>
        </div>

        <div class="stats">
          <article>
            <h2>50+</h2>
            <p>Projects Delivered</p>
          </article>
          <article>
            <h2>4+</h2>
            <p>Years Experience</p>
          </article>
          <article>
            <h2>99%</h2>
            <p>Client Satisfaction</p>
          </article>
        </div>

        <div class="actions">
          <a href="#work" class="button primary">Explore Work</a>
          <a href="https://www.github.com/FantoX001" target="_blank" class="button ghost"
            >GitHub Profile</a
          >
        </div>
      </section>

      <section class="wallpapers" id="work">
        <h3>Featured Wallpapers</h3>
        <div class="wallpaper-grid">
          <figure class="wallpaper-card">
            <img src="BG.png" alt="Blue abstract wallpaper" />
            <figcaption>Midnight Aurora</figcaption>
          </figure>
          <figure class="wallpaper-card">
            <img src="https://images.unsplash.com/photo-1475274047050-1d0c0975c63e?auto=format&fit=crop&w=1000&q=80" alt="Purple galaxy wallpaper" />
            <figcaption>Cosmic Bloom</figcaption>
          </figure>
          <figure class="wallpaper-card">
            <img src="https://images.unsplash.com/photo-1462331940025-496dfbfc7564?auto=format&fit=crop&w=1000&q=80" alt="Dark space wallpaper" />
            <figcaption>Stellar Drift</figcaption>
          </figure>
        </div>
      </section>
    </main>
  </body>
</html>
